project:
  type: website
  output-dir: quarto_build

version: "2.0.0"
metadata:
  date: today
  
execute:
  freeze: auto
date: last-modified  

format:
  html:
    theme:
      - minty
      - brand
    toc: true

website:
  title: "imageviewer"
  page-footer:
    center: "`imageviewer` version **{{< meta version >}}**, website last updated {{< meta date >}}"

  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        file: index.qmd
      - text: "Cataloging images"
        file: cataloging/index.qmd          
     

    right:
      - icon: person-circle
        menu:
          - text: "imageviewer on github"
            href: https://github.com/neelsmith/imageviewer        
          - text: "Neel Smith: other hobby projects"
            href: https://neelsmith.github.io/avocational/
        aria-label: Home 

