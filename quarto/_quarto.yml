project:
  type: website
  output-dir: quarto_build

version: "2.0.1"
metadata:
  date: today
  
execute:
  freeze: auto
date: last-modified  

format:
  html:
    theme:
      - minty
      - brand
    toc: true

website:
  title: "imageviewer"
  page-footer:
    center: "`imageviewer` version **{{< meta version >}}**, website last updated {{< meta date >}}"

  navbar:
    background: primary
    search: true
    left:
      - text: "Local images"
        file: local.qmd                 
      - text: "Catalogs"
        file: cataloging/index.qmd
      - text: "Citation"
        file: citable/index.qmd
      - text: "Public servers"
        file: servers.qmd          
      - text: "Reference"
        file: reference/index.qmd          
          

    right:
      - icon: person-circle
        menu:
          - text: "imageviewer on github"
            href: https://github.com/neelsmith/imageviewer        
          - text: "Neel Smith: other hobby projects"
            href: https://neelsmith.github.io/avocational/
        aria-label: Home 

  sidebar:
    - title: "Servers"
      contents:
        - servers.qmd
        - "---"
        - pcloud/index.qmd
        - www/index.qmd
    - title: "Reference"
      contents:
        - reference/index.qmd
        - "---"
        - reference/build/index.qmd
        - reference/sysadmin/index.qmd
        